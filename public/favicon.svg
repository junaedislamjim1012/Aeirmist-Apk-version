<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </linearGradient>

    <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FF"/>
      <stop offset="40%" stop-color="#0088FF"/>
      <stop offset="80%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#A822FF"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B5F6FF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00F2FF"/>
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Square Container -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#00F2FF" stroke-width="6" stroke-opacity="0.45" filter="url(#softGlow)"/>

  <!-- Main 'A' Arch -->
  <path d="M 148 380 Q 165 380 188 315 L 234 185 Q 256 122 278 185 L 324 315 Q 347 380 364 380"
        fill="none"
        stroke="url(#aGrad)"
        stroke-width="46"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glowFilter)"/>

  <!-- Horizontal Wave Crossbar -->
  <path d="M 125 305 C 180 265 210 325 256 295 C 302 265 332 315 387 285"
        fill="none"
        stroke="url(#waveGrad)"
        stroke-width="26"
        stroke-linecap="round"
        filter="url(#softGlow)"/>

  <!-- Core Quantum Dot -->
  <circle cx="256" cy="205" r="18" fill="#FFFFFF" filter="url(#softGlow)"/>
  <circle cx="256" cy="205" r="28" fill="none" stroke="#00F2FF" stroke-width="5" stroke-opacity="0.85"/>
</svg>